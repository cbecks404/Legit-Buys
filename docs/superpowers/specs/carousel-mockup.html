<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Legit Buys — Carousel Mockup</title>
<style>
  :root {
    --bg: #080808;
    --card-bg: #111;
    --surface: #131313;
    --surface2: #161616;
    --border: #1c1c1c;
    --border2: #2a2a2a;
    --text: #f0ede8;
    --text-mid: #cfccc6;
    --text-dim: #777;
    --lime: #C8FF47;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .phone {
    max-width: 430px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); position: relative; overflow: hidden;
  }

  /* --- Top bar (mimics filter + feed tabs) --- */
  .topbar { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
  .brand { font-size: 20px; letter-spacing: .06em; font-weight: 800; }
  .brand span { color: var(--lime); }
  .tabs { display: flex; gap: 8px; margin-top: 10px; }
  .tab { font-size: 11px; font-family: ui-monospace, Menlo, monospace; letter-spacing: .1em;
    padding: 6px 12px; border-radius: 99px; border: 1px solid var(--border2); color: var(--text-mid); }
  .tab.active { background: var(--lime); color: #0a0a0a; border-color: var(--lime); font-weight: 700; }

  /* --- Carousel --- */
  .carousel-wrap { position: relative; flex: 1 1 auto; min-height: 0; }
  .carousel {
    height: 100%; display: flex; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    padding: 10px 5%; gap: 0;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }
  .slot {
    flex: 0 0 90%; scroll-snap-align: center; height: 100%;
    padding: 0 5px; display: flex;
  }

  /* --- Card --- */
  .card {
    width: 100%; height: 100%; display: flex; flex-direction: column;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px;
    overflow: hidden;
    transition: border-color .25s, filter .3s ease, opacity .3s ease, transform .3s ease;
    /* non-active (peeking) cards are blurred + dimmed + slightly shrunk */
    filter: blur(2px); opacity: .55; transform: scale(.96);
  }
  .slot.is-active .card {
    border-color: #2f2f2f;
    filter: blur(0); opacity: 1; transform: scale(1);
  }

  /* rating band — pinned top */
  .band { flex: 0 0 auto; padding: 12px 16px; display: flex; align-items: center;
    justify-content: space-between; background: linear-gradient(135deg, #1a1a1a, #0e0e0e);
    border-bottom: 1px solid var(--border); }
  .band .score { font-size: 11px; font-family: ui-monospace, monospace; font-weight: 700;
    color: var(--lime); background: #C8FF4718; border: 1px solid #C8FF4744; padding: 3px 10px; border-radius: 99px; }
  .band .price { font-size: 11px; font-family: ui-monospace, monospace; color: var(--text-dim); }

  /* scrollable middle */
  .body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .body::-webkit-scrollbar { width: 0; }
  .product { font-family: Georgia, serif; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .review { margin: 0; font-family: Georgia, serif; font-style: italic; font-size: 15px; line-height: 1.7; color: var(--text-mid); }
  .meta { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 600; color: var(--text-mid); letter-spacing: .04em; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 10px; font-family: ui-monospace, monospace; color: var(--text-mid);
    background: var(--surface2); border: 1px solid var(--border2); padding: 2px 9px; border-radius: 99px; }
  .lbl { font-size: 9px; color: var(--text-dim); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
  .photo { width: 100%; height: 150px; border-radius: 10px; object-fit: cover; display: block;
    background: linear-gradient(135deg,#222,#333); }

  /* map active vs placeholder */
  .map-frame { width: 100%; height: 150px; border: none; border-radius: 10px; display: block; }
  .map-ph { width: 100%; height: 150px; border-radius: 10px; border: 1px dashed var(--border2);
    background: repeating-linear-gradient(45deg,#101010,#101010 10px,#141414 10px,#141414 20px);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-dim); }
  .map-ph .pin { font-size: 22px; }
  .map-ph .hint { font-size: 10px; font-family: ui-monospace, monospace; letter-spacing: .08em; }
  .map-link { font-size: 10px; color: var(--text-mid); text-decoration: none; display: inline-block; margin-top: 6px; }

  /* footer — pinned bottom */
  .footer { flex: 0 0 auto; padding: 10px 14px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card-bg); }
  .author { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; flex: 0 0 auto; display: flex; align-items: center;
    justify-content: center; font-size: 10px; font-weight: 700; font-family: ui-monospace, monospace; }
  .name { font-size: 13px; font-weight: 700; }
  .badge { color: var(--lime); font-size: 12px; }
  .actions { display: flex; gap: 6px; flex: 0 0 auto; }
  .btn { background: transparent; border: 1px solid var(--border2); color: var(--text-mid);
    border-radius: 99px; padding: 7px 12px; font-size: 13px; cursor: pointer; }
  .btn.up { padding: 7px 14px; }

  /* counter chip */
  .counter { position: absolute; top: 18px; right: 22px; z-index: 5;
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 700; letter-spacing: .08em;
    background: rgba(0,0,0,.7); border: 1px solid var(--border2); color: var(--text-mid);
    padding: 5px 11px; border-radius: 99px; backdrop-filter: blur(6px); }

  /* bottom action bar (mimic) */
  .bottombar { flex: 0 0 auto; padding: 14px 18px calc(14px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(8,8,8,.95), rgba(8,8,8,.6) 70%, transparent);
    display: flex; justify-content: center; }
  .fab { background: var(--lime); color: #0a0a0a; font-weight: 800; border: none; border-radius: 99px;
    padding: 13px 28px; font-size: 14px; letter-spacing: .04em; }
  .hint-banner { text-align: center; font-size: 11px; color: var(--text-dim); font-family: ui-monospace, monospace;
    padding: 6px; letter-spacing: .06em; }
</style>
</head>
<body>
<div class="phone">
  <div class="topbar">
    <div class="brand">LEGIT<span>BUYS</span></div>
    <div class="tabs">
      <div class="tab active">ALL</div>
      <div class="tab">FOLLOWING</div>
      <div class="tab">🍔 FOOD</div>
      <div class="tab">☕ DRINK</div>
    </div>
  </div>

  <div class="carousel-wrap">
    <div class="counter" id="counter">1 / 4</div>
    <div class="carousel" id="carousel"></div>
  </div>

  <div class="hint-banner">← swipe between cards · only the centered card loads a live map →</div>
  <div class="bottombar"><button class="fab">+ POST A BUY</button></div>
</div>

<script>
const PALETTE = ["#C8FF47","#60C3F5","#F4A942","#C084FC","#FF6B6B","#4ECDC4"];
const CARDS = [
  { product: "Smashed double cheeseburger", score: "✦ ELITE", price: "£9 · ££", review: "Genuinely the best burger I’ve had in the city this year. Crispy lacy edges, the cheese pull is unreal, and the bun holds together to the last bite. Worth the queue on a Friday night.", meta: "£9 · 🍔 Food · Shoreditch", tags: ["Halal","Spicy option"], where: "Le Bun, Shoreditch", author: "Maya R." },
  { product: "Oat flat white", score: "WORTH IT", price: "£3.40 · £", review: "Smooth, not bitter, and the oat milk actually integrates instead of splitting. Reliable morning order. The latte art is a nice touch but the taste is what brings me back.", meta: "£3.40 · ☕ Drink · Peckham", tags: ["Vegan","Dairy-free"], where: "Old Spike Roastery, Peckham", author: "Dev P." },
  { product: "Birria tacos (order of 3)", score: "✦ ELITE", price: "£11 · ££", review: "The consommé is rich and beefy, tacos griddled till crisp. Messy in the best way — bring napkins. Easily a top-three taco experience outside of actual Mexico.", meta: "£11 · 🌮 Food · Camden", tags: ["Gluten-free option"], where: "El Pastor, Camden", author: "Sofia L." },
  { product: "Matcha soft serve", score: "DECENT", price: "£5 · ££", review: "Pleasantly grassy and not too sweet, though it melts fast so eat quick. Cute spot. I’d get it again on a hot day but it’s not a destination dessert.", meta: "£5 · 🍦 Drink · Soho", tags: ["Vegetarian"], where: "Kova, Soho", author: "Tom W." },
];

function initials(n){const p=n.trim().split(/\s+/);return (p.length===1?p[0][0]:p[0][0]+p[p.length-1][0]).toUpperCase();}
function colorFor(n){let h=0;for(let i=0;i<n.length;i++)h=(n.charCodeAt(i)+((h<<5)-h))|0;return PALETTE[Math.abs(h)%PALETTE.length];}

const carousel = document.getElementById('carousel');
CARDS.forEach((c, i) => {
  const ac = colorFor(c.author);
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.dataset.index = i;
  slot.innerHTML = `
    <div class="card">
      <div class="band">
        <span class="score">${c.score}</span>
        <span class="price">${c.price}</span>
      </div>
      <div class="body">
        <div class="product">${c.product}</div>
        <p class="review">${c.review}</p>
        <div class="meta">${c.meta}</div>
        <div class="tags">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div><div class="lbl">Photo</div><div class="photo"></div></div>
        <div>
          <div class="lbl">Location</div>
          <div class="map-mount" data-q="${encodeURIComponent(c.where)}">
            <div class="map-ph"><div class="pin">📍</div><div class="hint">swipe here to load map</div></div>
          </div>
          <a class="map-link" href="#">Open in Google Maps ↗</a>
        </div>
      </div>
      <div class="footer">
        <div class="author">
          <div class="avatar" style="background:${ac}22;border:1px solid ${ac}55;color:${ac}">${initials(c.author)}</div>
          <span class="name">${c.author}</span><span class="badge">✦</span>
        </div>
        <div class="actions">
          <button class="btn">↗</button>
          <button class="btn">🔖</button>
          <button class="btn up">↑ ${12+i*7}</button>
        </div>
      </div>
    </div>`;
  carousel.appendChild(slot);
});

const counter = document.getElementById('counter');
const slots = [...carousel.querySelectorAll('.slot')];

function mountMap(slot){
  const m = slot.querySelector('.map-mount');
  if (m.dataset.loaded) return;
  m.dataset.loaded = '1';
  const q = m.dataset.q;
  m.innerHTML = `<iframe class="map-frame" loading="lazy" src="https://maps.google.com/maps?q=${q}&output=embed"></iframe>`;
}
function unmountMap(slot){
  const m = slot.querySelector('.map-mount');
  if (!m.dataset.loaded) return;
  m.dataset.loaded = '';
  m.innerHTML = `<div class="map-ph"><div class="pin">📍</div><div class="hint">swipe here to load map</div></div>`;
}

const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    const slot = e.target;
    if (e.intersectionRatio >= 0.6){
      slot.classList.add('is-active');
      counter.textContent = `${+slot.dataset.index + 1} / ${CARDS.length}`;
      mountMap(slot);
    } else {
      slot.classList.remove('is-active');
      unmountMap(slot);
    }
  });
}, { root: carousel, threshold: [0, 0.6, 1] });

slots.forEach(s => io.observe(s));
</script>
</body>
</html>

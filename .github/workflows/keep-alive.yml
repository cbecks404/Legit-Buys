name: Supabase keep-alive

on:
  schedule:
    # Mondays and Thursdays at 08:17 UTC (max gap 4 days, well inside the 7-day pause window)
    - cron: "17 8 * * 1,4"
  workflow_dispatch: # lets you run it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing or misnamed"
            exit 1
          fi

      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Strip any trailing slash so the URL doesn't end up with //rest
          BASE="${SUPABASE_URL%/}"
          STATUS=$(curl -sS -o response.txt -w "%{http_code}" \
            --retry 3 --retry-delay 10 \
            "$BASE/rest/v1/reviews?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "HTTP status: $STATUS"
          echo "Response: $(cat response.txt)"
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase ping failed with status $STATUS"
            exit 1
          fi
          echo "Supabase is awake."

name: Supabase keepalive

# Free-tier Supabase projects pause after 7 days of zero API activity.
# This workflow hits the public REST API on a schedule to keep it warm.

on:
  schedule:
    # Every 5 days at 09:00 UTC — well inside the 7-day window.
    - cron: '0 9 */5 * *'
  workflow_dispatch: # allows manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: https://guviwpumuctfstivdwba.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd1dml3cHVtdWN0ZnN0aXZkd2JhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjMyMzksImV4cCI6MjA4ODI5OTIzOX0.aENRdypTeYXPB89D4h7e5LphGkfz-DjgpksyieFoX-o
        run: |
          curl -sSf \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/reviews?select=id&limit=1" \
            -o /dev/null \
            -w "HTTP %{http_code} in %{time_total}s\n"
